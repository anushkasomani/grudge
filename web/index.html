<meta charset="utf-8">
<title>Grudge Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #12100E;
    --ink-2: #4A443C;
    --ink-3: #7C7469;
    --paper: #FBF9F5;
    --card: #FFFFFF;
    --rule: #E3DDD1;
    --rule-2: #EFEAE0;
    --amber: #B4762A;
    --amber-soft: #F3E7D4;
    --green: #2F6B4F;
    --green-soft: #E2EDE6;
    --red: #A33A2C;
    --red-soft: #F6E3DF;
    --shadow: 0 1px 2px rgba(18,16,14,.05), 0 8px 24px -12px rgba(18,16,14,.14);

    --display: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #F2EDE4;
      --ink-2: #B5ADA0;
      --ink-3: #837B70;
      --paper: #14120F;
      --card: #1C1916;
      --rule: #2E2924;
      --rule-2: #262220;
      --amber: #D89A46;
      --amber-soft: #35291A;
      --green: #6BB98C;
      --green-soft: #1B2E23;
      --red: #DE7C6B;
      --red-soft: #33201C;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    }
  }

  :root[data-theme="dark"] {
    --ink: #F2EDE4;
    --ink-2: #B5ADA0;
    --ink-3: #837B70;
    --paper: #14120F;
    --card: #1C1916;
    --rule: #2E2924;
    --rule-2: #262220;
    --amber: #D89A46;
    --amber-soft: #35291A;
    --green: #6BB98C;
    --green-soft: #1B2E23;
    --red: #DE7C6B;
    --red-soft: #33201C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 28px 96px;
    display: flex;
    flex-direction: column;
    gap: 44px;
  }

  /* ---------- masthead ---------- */
  .masthead { display: flex; flex-direction: column; gap: 14px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--amber);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .eyebrow::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule);
    min-width: 24px;
  }

  h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(38px, 6vw, 62px);
    line-height: 1.02;
    letter-spacing: -.02em;
    margin: 0;
    text-wrap: balance;
  }
  h1 em { font-style: italic; color: var(--amber); }

  .standfirst {
    font-family: var(--display);
    font-size: 19px;
    line-height: 1.5;
    color: var(--ink-2);
    max-width: 62ch;
    margin: 0;
  }

  .meta {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    padding-top: 6px;
    border-top: 1px solid var(--rule);
  }
  .meta b { color: var(--ink-2); font-weight: 500; }

  /* ---------- verdict ---------- */
  .verdict {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .verdict-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
  }
  @media (max-width: 720px) {
    .verdict-grid { grid-template-columns: 1fr; }
  }

  .col { padding: 30px 32px 26px; display: flex; flex-direction: column; gap: 6px; }
  .col.wiped { background: linear-gradient(180deg, var(--red-soft) 0%, transparent 62%); }
  .col.intact { background: linear-gradient(180deg, var(--green-soft) 0%, transparent 62%); }

  .col-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .col.wiped .col-label { color: var(--red); }
  .col.intact .col-label { color: var(--green); }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .price {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(34px, 5vw, 48px);
    font-weight: 600;
    letter-spacing: -.03em;
    line-height: 1.05;
  }
  .col.wiped .price { color: var(--red); }
  .col.intact .price { color: var(--green); }

  .price-note { font-size: 13px; color: var(--ink-3); font-family: var(--mono); }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 22px;
    border-left: 1px solid var(--rule-2);
    border-right: 1px solid var(--rule-2);
  }
  @media (max-width: 720px) {
    .divider {
      border: none;
      border-top: 1px solid var(--rule-2);
      border-bottom: 1px solid var(--rule-2);
      padding: 18px;
    }
  }

  .delta-stack { text-align: center; display: flex; flex-direction: column; gap: 2px; }
  .delta-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .delta-value {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 600;
    color: var(--amber);
    letter-spacing: -.02em;
  }
  .delta-pct { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }

  /* ---------- behaviour diff ---------- */
  .diff { border-top: 1px solid var(--rule); }

  .diff-row {
    display: grid;
    grid-template-columns: 1fr 190px 1fr;
    align-items: center;
    border-bottom: 1px solid var(--rule-2);
    font-size: 13.5px;
  }
  .diff-row:last-child { border-bottom: none; }
  @media (max-width: 720px) {
    .diff-row { grid-template-columns: 1fr; text-align: left; }
  }

  .diff-key {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
    text-align: center;
    padding: 12px 10px;
  }
  @media (max-width: 720px) {
    .diff-key { text-align: left; padding-bottom: 2px; }
  }

  .diff-cell { padding: 12px 32px; color: var(--ink-2); }
  .diff-cell.l { text-align: right; }
  .diff-cell.r { text-align: left; }
  @media (max-width: 720px) {
    .diff-cell.l, .diff-cell.r { text-align: left; padding: 2px 18px; }
    .diff-cell.l::before { content: "wiped — "; color: var(--red); font-family: var(--mono); font-size: 11px; }
    .diff-cell.r::before { content: "intact — "; color: var(--green); font-family: var(--mono); font-size: 11px; }
  }

  .diff-cell strong { color: var(--ink); font-weight: 600; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .flag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 3px;
    border: 1px solid;
  }
  .flag.yes { color: var(--green); border-color: var(--green); background: var(--green-soft); }
  .flag.no  { color: var(--red);   border-color: var(--red);   background: var(--red-soft); }

  /* ---------- sections ---------- */
  section { display: flex; flex-direction: column; gap: 18px; }

  h2 {
    font-family: var(--display);
    font-weight: 500;
    font-size: 27px;
    letter-spacing: -.015em;
    margin: 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  h2 .n {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--amber);
    letter-spacing: .12em;
  }
  .lede { color: var(--ink-2); max-width: 68ch; margin: -6px 0 0; }

  /* ---------- dossier ---------- */
  .panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .table-scroll { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 500;
    text-align: right;
    padding: 12px 16px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  thead th:first-child { text-align: left; }
  tbody td {
    padding: 11px 16px;
    border-bottom: 1px solid var(--rule-2);
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-family: var(--mono);
    color: var(--ink-2);
    white-space: nowrap;
  }
  tbody td:first-child {
    text-align: left;
    font-family: var(--sans);
    color: var(--ink);
    white-space: normal;
  }
  tbody tr:last-child td { border-bottom: none; }

  .verdict-tag {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .08em;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 500;
  }
  .v-WORKS { color: var(--green); background: var(--green-soft); }
  .v-DEAD  { color: var(--red);   background: var(--red-soft); }
  .v-WEAK  { color: var(--amber); background: var(--amber-soft); }

  .findings {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    border-top: 1px solid var(--rule);
  }
  .finding {
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    border-right: 1px solid var(--rule-2);
  }
  .finding:last-child { border-right: none; }
  .finding-k {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .finding-v {
    font-family: var(--mono);
    font-size: 19px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
  }
  .finding-note { font-size: 12.5px; color: var(--ink-3); line-height: 1.45; }

  /* ---------- transcripts ---------- */
  .transcripts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 900px) {
    .transcripts { grid-template-columns: 1fr; }
  }

  .tcol { display: flex; flex-direction: column; gap: 0; }

  .thead {
    padding: 14px 18px;
    border: 1px solid var(--rule);
    border-bottom: none;
    border-radius: 4px 4px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    background: var(--card);
  }
  .tcol.wiped .thead { border-top: 2px solid var(--red); }
  .tcol.intact .thead { border-top: 2px solid var(--green); }

  .thead-name {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .13em;
    text-transform: uppercase;
  }
  .tcol.wiped .thead-name { color: var(--red); }
  .tcol.intact .thead-name { color: var(--green); }
  .thead-price {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 16px;
  }

  .tbody {
    border: 1px solid var(--rule);
    border-radius: 0 0 4px 4px;
    background: var(--card);
    padding: 6px 0 10px;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
  }

  .round-rule {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px 8px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .round-rule::after { content: ""; flex: 1; height: 1px; background: var(--rule-2); }

  .turn { padding: 7px 18px; display: flex; flex-direction: column; gap: 4px; }

  .turn-who {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .turn.buyer .turn-who { color: var(--amber); }
  .turn.vendor .turn-who { color: var(--ink-3); }

  .tactic-chip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .04em;
    text-transform: none;
    padding: 1px 7px;
    border-radius: 3px;
    background: var(--amber-soft);
    color: var(--amber);
  }

  .turn-msg { font-size: 13.5px; line-height: 1.5; color: var(--ink); }
  .turn.vendor .turn-msg { color: var(--ink-2); }

  .turn-foot {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }

  .threat {
    color: var(--red);
    font-family: var(--mono);
    font-size: 11px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .reasoning {
    font-size: 12px;
    color: var(--ink-3);
    font-style: italic;
    border-left: 2px solid var(--rule);
    padding-left: 9px;
    line-height: 1.45;
  }

  .settled-bar {
    margin: 10px 18px 2px;
    padding: 10px 14px;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tcol.wiped .settled-bar { background: var(--red-soft); color: var(--red); }
  .tcol.intact .settled-bar { background: var(--green-soft); color: var(--green); }

  /* ---------- reasoning list ---------- */
  .why {
    background: var(--card);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--green);
    border-radius: 4px;
    padding: 20px 24px;
    box-shadow: var(--shadow);
  }
  .why ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 9px; }
  .why li { color: var(--ink-2); line-height: 1.5; font-size: 14px; }
  .why li::marker { color: var(--amber); font-family: var(--mono); font-size: 12px; }

  /* ---------- settlement ---------- */
  .chain {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 28px;
    align-items: baseline;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 18px 22px;
    box-shadow: var(--shadow);
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .chain a { color: var(--amber); text-decoration: none; border-bottom: 1px solid currentColor; word-break: break-all; }
  .chain a:hover, .chain a:focus-visible { color: var(--ink); }

  footer {
    border-top: 1px solid var(--rule);
    padding-top: 18px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--ink-3);
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
  }

  /* ---------- vendor switcher ---------- */
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0;
  }
  .tab {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .04em;
    padding: 9px 15px;
    border: 1px solid var(--rule);
    border-bottom: none;
    border-radius: 4px 4px 0 0;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
    margin-bottom: -1px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] {
    background: var(--card);
    color: var(--ink);
    border-top: 2px solid var(--amber);
  }
  .tab .tab-delta {
    font-variant-numeric: tabular-nums;
    color: var(--green);
    font-size: 11px;
  }

  .engine-tag {
    font-family: var(--mono);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    background: var(--amber-soft);
    color: var(--amber);
  }

  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .empty {
    padding: 40px;
    text-align: center;
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
  }
</style>

<div class="wrap">
  <div class="tabs" id="tabs" role="tablist" hidden></div>
  <div id="app">
    <div class="empty">Loading comparison…</div>
  </div>
</div>

<script>
const FALLBACK_NOTE = `Run <code>grudge compare --vendor datadog --offline --export</code> then reload.`;

function money(n, dp) {
  if (n === null || n === undefined) return "—";
  return "$" + Number(n).toLocaleString("en-US", {
    minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0
  });
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

function renderTurns(side, vendorName) {
  let html = "";
  let round = 0;
  for (const t of side.turns) {
    if (t.speaker === "buyer" && t.round !== round) {
      round = t.round;
      html += `<div class="round-rule">Round ${round}</div>`;
    }
    const who = t.speaker === "buyer" ? "Grudge" : vendorName;
    const chip = t.tactic ? `<span class="tactic-chip">${esc(t.tactic)}</span>` : "";
    const offer = t.offer
      ? `<span>${t.speaker === "buyer" ? "offers" : "quotes"} ${money(t.offer)}</span>` : "";
    const threat = t.threat
      ? `<span class="threat">&#9888; threatens to walk</span>` : "";
    const reason = t.reasoning
      ? `<div class="reasoning">${esc(t.reasoning)}</div>` : "";
    html += `
      <div class="turn ${t.speaker}">
        <div class="turn-who">${esc(who)}${chip}</div>
        <div class="turn-msg">${esc(t.message)}</div>
        ${(offer || threat) ? `<div class="turn-foot">${offer}${threat}</div>` : ""}
        ${reason}
      </div>`;
  }
  const outcome = side.agreed
    ? `<div class="settled-bar"><span>Settled</span><span>${money(side.settled)} &middot; ${side.rounds} rounds</span></div>`
    : `<div class="settled-bar"><span>No deal</span><span>${side.rounds} rounds</span></div>`;
  return html + outcome;
}

function render(d) {
  const wm = d.withMemory, wo = d.withoutMemory;
  const dossier = d.dossier || {};
  const ledger = dossier.tactic_ledger || {};
  const bluff = (dossier.bluff_ledger || {}).walkaway_threat;
  const floor = dossier.floor_estimate;
  const curve = dossier.concession_curve || {};
  const pct = (d.delta && wo.settled) ? (d.delta / wo.settled * 100) : 0;
  const offList = (s) => s ? ((d.listPrice - s) / d.listPrice * 100).toFixed(1) + "% off list" : "—";

  const rows = Object.entries(ledger).sort((a, b) =>
    (a[1].avg_delta_pct || 0) - (b[1].avg_delta_pct || 0));

  const diff = [
    ["opening ask", `<span class="num">${money(wo.openingAsk)}</span>`,
                    `<span class="num">${money(wm.openingAsk)}</span>`],
    ["opened with", `<strong>${esc(wo.openedWith || "—")}</strong>`,
                    `<strong>${esc(wm.openedWith || "—")}</strong>`],
    ["levers skipped", wo.banned.length ? esc(wo.banned.join(", ")) : "none",
                       wm.banned.length ? `<strong>${esc(wm.banned.join(", "))}</strong>` : "none"],
    ["believed floor", `<span class="num">—</span>`,
                       `<span class="num">${wm.floorEstimate ? money(wm.floorEstimate) : "—"}</span>`],
    ["walkaway threats faced", `<span class="num">${wo.threats}</span>`,
                               `<span class="num">${wm.threats}</span>`],
    ["held firm on threat",
      `<span class="flag ${wo.holdFirm ? "yes" : "no"}">${wo.holdFirm ? "yes" : "no"}</span>`,
      `<span class="flag ${wm.holdFirm ? "yes" : "no"}">${wm.holdFirm ? "yes" : "no"}</span>`],
    ["rounds used", `<span class="num">${wo.rounds}</span>`,
                    `<span class="num">${wm.rounds}</span>`],
  ];

  const eng = d.engine || {};
  const engineText = eng.buyer
    ? (eng.buyer.startsWith("scripted")
        ? "offline scripted counterparty"
        : `${eng.buyer.split(":")[0]} vs ${(eng.vendor || "").split(":")[0]}`)
    : null;
  const engineTag = engineText
    ? `<span class="engine-tag">${esc(engineText)}</span>` : "";

  const settled = d.settlement || {};
  const chainHtml = settled.tx_hash
    ? `<div class="chain">
         <span><b>Settled on-chain</b></span>
         <span>${esc(String(settled.amount_usdc))} USDC &middot; Base Sepolia</span>
         <span>tx <a href="${esc(settled.explorer_url || "#")}" target="_blank" rel="noopener">${esc(settled.tx_hash)}</a></span>
       </div>`
    : `<div class="chain"><span>${esc(settled.note || "Settlement not run for this export (use --no-settle to skip, or set BASE_PRIVATE_KEY to post a real transfer).")}</span></div>`;

  document.getElementById("app").innerHTML = `
    <header class="masthead">
      <div class="eyebrow">Renewal negotiation &middot; ${esc(d.vendor)}</div>
      <h1>The same renewal, <em>twice</em>.<br>Once with a memory.</h1>
      <p class="standfirst">
        Grudge negotiated this contract before and wrote down what happened: which
        levers moved ${esc(d.vendor)}, which ones they ignored, and whether their
        threat to walk was ever real. Delete that file and the agent walks in blind.
      </p>
      <div class="meta">
        <span>List price <b>${money(d.listPrice)}</b></span>
        <span>Counterparty <b>autonomous vendor agent</b></span>
        <span>Memory <b>Sibyl · SQLite + FTS5</b></span>
        <span>Settlement <b>USDC on Base Sepolia</b></span>
        ${engineTag}
      </div>
    </header>

    <div class="verdict">
      <div class="verdict-grid">
        <div class="col wiped">
          <div class="col-label"><span class="dot"></span>Memory deleted</div>
          <div class="price">${money(wo.settled)}</div>
          <div class="price-note">${offList(wo.settled)} &middot; ${wo.rounds} rounds</div>
        </div>
        <div class="divider">
          <div class="delta-stack">
            <div class="delta-label">Memory saved</div>
            <div class="delta-value">${money(d.delta)}</div>
            <div class="delta-pct">${pct.toFixed(1)}% cheaper</div>
          </div>
        </div>
        <div class="col intact">
          <div class="col-label"><span class="dot"></span>Memory intact</div>
          <div class="price">${money(wm.settled)}</div>
          <div class="price-note">${offList(wm.settled)} &middot; ${wm.rounds} rounds</div>
        </div>
      </div>
      <div class="diff">
        ${diff.map(([k, l, r]) => `
          <div class="diff-row">
            <div class="diff-cell l">${l}</div>
            <div class="diff-key">${esc(k)}</div>
            <div class="diff-cell r">${r}</div>
          </div>`).join("")}
      </div>
    </div>

    <section>
      <h2><span class="n">01</span>What it wrote down last cycle</h2>
      <p class="lede">
        One dossier per vendor in Sibyl's entity tier, rebuilt after every
        settlement. This is the entire input to the second negotiation — there is
        no conversation history carried over.
      </p>
      <div class="panel">
        <div class="table-scroll">
          <table>
            <thead>
              <tr><th>Lever</th><th>Tried</th><th>Moved them</th><th>Avg effect</th><th>Verdict</th></tr>
            </thead>
            <tbody>
              ${rows.map(([k, v]) => `
                <tr>
                  <td>${esc(k.replace(/_/g, " "))}</td>
                  <td>${v.tried || 0}</td>
                  <td>${v.moved || 0}</td>
                  <td>${(v.avg_delta_pct || 0).toFixed(1)}%</td>
                  <td><span class="verdict-tag v-${esc(v.verdict)}">${esc(v.verdict)}</span></td>
                </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div class="findings">
          ${bluff ? `
            <div class="finding">
              <div class="finding-k">Walkaway threat</div>
              <div class="finding-v" style="color:var(--red)">${esc(bluff.verdict)}</div>
              <div class="finding-note">${bluff.threatened} threatened, ${bluff.executed} executed. ${esc(bluff.evidence || "")}</div>
            </div>` : ""}
          ${floor ? `
            <div class="finding">
              <div class="finding-k">Believed floor</div>
              <div class="finding-v" style="color:var(--amber)">${money(floor.value)}</div>
              <div class="finding-note">${Math.round((floor.confidence || 0) * 100)}% confidence — ${esc(floor.basis || "")}</div>
            </div>` : ""}
          ${curve.rounds_to_first_move ? `
            <div class="finding">
              <div class="finding-k">Concession curve</div>
              <div class="finding-v">R${curve.rounds_to_first_move}</div>
              <div class="finding-note">Ignores the first ${curve.rounds_to_first_move} round(s); average step ${(curve.avg_step_pct || 0).toFixed(1)}%.</div>
            </div>` : ""}
        </div>
      </div>
    </section>

    <section>
      <h2><span class="n">02</span>How that changed the opening move</h2>
      <div class="why">
        <ol>${wm.rationale.map(r => `<li>${esc(r)}</li>`).join("")}</ol>
      </div>
    </section>

    <section>
      <h2><span class="n">03</span>Both transcripts, side by side</h2>
      <p class="lede">
        Same vendor agent, same secret floor, same round budget. The only
        difference is whether the dossier above was readable.
      </p>
      <div class="transcripts">
        <div class="tcol wiped">
          <div class="thead">
            <span class="thead-name">Memory deleted</span>
            <span class="thead-price">${money(wo.settled)}</span>
          </div>
          <div class="tbody">${renderTurns(wo, d.vendor)}</div>
        </div>
        <div class="tcol intact">
          <div class="thead">
            <span class="thead-name">Memory intact</span>
            <span class="thead-price">${money(wm.settled)}</span>
          </div>
          <div class="tbody">${renderTurns(wm, d.vendor)}</div>
        </div>
      </div>
    </section>

    <section>
      <h2><span class="n">04</span>Settlement</h2>
      ${chainHtml}
    </section>

    <footer>
      <span>grudge</span>
      <span>Sibyl Memory · Virtuals ACP · Base Sepolia</span>
      <span>Delete the memory layer and the price moves.</span>
    </footer>`;
}

function showError() {
  document.getElementById("app").innerHTML =
    `<div class="empty">No comparison export found.<br><br>${FALLBACK_NOTE}<br><br>
     Then serve this folder: <code>python3 -m http.server -d web 8000</code></div>`;
}

function buildTabs(runs, activeId, onPick) {
  const bar = document.getElementById("tabs");
  if (runs.length < 2) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = "";
  for (const run of runs) {
    const b = document.createElement("button");
    b.className = "tab";
    b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(run.vendorId === activeId));
    b.innerHTML = `<span>${esc(run.vendor)}</span>` +
      (run.delta ? `<span class="tab-delta">-${money(run.delta)}</span>` : "");
    b.addEventListener("click", () => onPick(run));
    bar.appendChild(b);
  }
}

function loadRun(run, runs) {
  fetch("runs/" + run.file)
    .then(r => { if (!r.ok) throw new Error("missing"); return r.json(); })
    .then(d => {
      buildTabs(runs, d.vendorId, other => loadRun(other, runs));
      render(d);
      history.replaceState(null, "", "#" + d.vendorId);
    })
    .catch(showError);
}

fetch("runs/index.json")
  .then(r => { if (!r.ok) throw new Error("no index"); return r.json(); })
  .then(idx => {
    const runs = idx.runs || [];
    if (!runs.length) return showError();
    const wanted = decodeURIComponent(location.hash.replace("#", ""));
    const pick = runs.find(r => r.vendorId === wanted) || runs[0];
    loadRun(pick, runs);
  })
  .catch(showError);
</script>
